لمكتب ووفقًا لتعليماته المكتوبة، ولا يجوز لها معالجتها لأي غرض آخر. وتُعدّ الشركة متحكِّمًا في بيانات حسابات المكتب ومستخدميه وبيانات الاشتراك والفوترة."],["البيانات التي تُعالَج","تشمل البيانات التي تُعالَج: بيانات التعريف والتواصل (الاسم، ورقم الهاتف، والرقم القومي، والعنوان، وصورة بطاقة الرقم القومي)، وبيانات الوحدات والعقود والمدفوعات والإيصالات، وطلبات العملاء والمعاينات، وسجل الموافقات، وبيانات مستخدمي المكتب وسجل نشاطهم."],["أغراض المعالجة","تُعالَج البيانات لأغراض إدارة الوحدات والعقود، وتحصيل الإيجارات والأقساط، وإدارة حسابات الملاك، ومتابعة طلبات العملاء، وإرسال التذكيرات المتعلقة بالتعامل، ولا تُستخدم لأي غرض آخر. ولا تبيع الشركة البيانات ولا تؤجّرها، ولا تُفصح عنها للغير إلا بالقدر اللازم لتنفيذ التعامل، أو تنفيذًا لحكم القانون أو لأمر قضائي."],["مكان الحفظ وتأمين البيانات","تُحفظ البيانات على خوادم داخل جمهورية مصر العربية، ولا تُنقل خارجها إلا بعد الحصول على الترخيص اللازم من المركز وموافقة أصحاب البيانات وفقًا للقانون. وتلتزم الشركة بتشفير البيانات، وتقييد الوصول إليها بالصلاحيات، وإجراء نسخ احتياطي يومي، والاحتفاظ بسجل لعمليات الدخول والاطلاع والتعديل والتنزيل والمحو."],["التزامات المكتب","يلتزم المكتب بما يأتي: الحصول على الترخيص أو التصريح اللازم من المركز متى كان ذلك واجبًا عليه؛ وتعيين مسؤول لحماية البيانات الشخصية وفقًا للقانون؛ والحصول على موافقة صريحة من صاحب البيانات قبل إرسال أي رسائل تسويقية إليه، والاحتفاظ بما يُثبتها، وتمكينه من العدول عنها في أي وقت؛ ومنح كل مستخدم أقل قدر من الصلاحيات يلزمه لأداء عمله؛ والحفاظ على سرية كلمات المرور؛ والتحقق من صحة البيانات التي يُدخلها."],["التزامات الشركة","تلتزم الشركة بمعالجة البيانات وفقًا لتعليمات المكتب وأحكام القانون، والمحافظة على سريتها، وإخطار المكتب دون تأخير فور علمها بأي خرق أو انتهاك للبيانات، بما يمكّنه من إخطار المركز خلال اثنتين وسبعين ساعة، وإخطار أصحاب البيانات المتأثرين خلال ثلاثة أيام عمل. ولا تستعين الشركة بأي معالج آخر، كمقدِّم خدمة الاستضافة، إلا بموجب عقد يتضمن ضمانات لا تقل عن الواردة في هذه الشروط."],["حقوق أصحاب البيانات","يوفّر التطبيق للمكتب الأدوات اللازمة لتمكين أصحاب الب
